spring:
  datasource:
    username: ${DB_USER}
    password: ${DB_PASSWORD}
    driver-class-name: org.postgresql.Driver

  jpa:
    show-sql: true
    open-in-view: false

jwt:
  secret: ${JWT_SECRET}

server:
  servlet:
    context-path: /api/v1

app:
  admin:
    email: ${ADMIN_EMAIL}
    password: ${ADMIN_PASSWORD}

springdoc:
  swagger-ui:
    tagsSorter: alpha
    operationsSorter: alpha