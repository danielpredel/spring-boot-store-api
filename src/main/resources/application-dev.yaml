spring:
  application:
    name: user-api-basic-dev
  datasource:
    url: jdbc:postgresql://localhost:5332/${DB_NAME}
    username: ${DB_USER}
    password: ${DB_PASSWORD}
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: update
    properties:
      hibernate:
        format_sql: true
    show-sql: true
